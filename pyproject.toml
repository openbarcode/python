[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbarcode"
dynamic = ["version"]
description = "Module patterns for UPC-A, EAN-13 and Code 39 barcodes, with no runtime dependencies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Yoel Nunez" }]
requires-python = ">=3.9"
keywords = ["barcode", "upc", "upc-a", "ean", "ean-13", "code39", "code 39", "gs1"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://openbarcode.dev"
Repository = "https://github.com/openbarcode/python"

[tool.setuptools.dynamic]
version = { attr = "openbarcode.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
